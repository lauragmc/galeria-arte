<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="widh=device-width,initial-scale=1.0">
        <title> Contacto | Galería de Arte</title>
    </head>
    <body>

        <header>
            <h1>Contacto</h1>

            <nav>
                <a href="index.html">Inicio</a>
                <a href="galeria.html">Galeria</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>

        <main>
            <h2>¡Contáctanos!</h2>

            <form action="#" method="get">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"
                        name="nombre" required>
                <br><br>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"
                        name="correo" required>
                <br><br>

                <label for="solicitud">Tipo de solicitud</label>
                <select id="solicitud" name="solicitud" required>
                        <option value="">Selecciona una opción</option>
                        <option value="compra">Compra</option>
                        <option value="Consulta">Consulta</option>
                        <option value="Venta">Venta</option>
                </select>
                <br><br>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"
                        rows="5" required></textarea>
                <br><br>

                <button type="submit">Enviar Mensaje</button>

            </form>
    
            <section>
                <h2>Información de contacto</h2>
                <p>Dirección: Avenida del Arte #123, Santiago, Chile</p>
                <p>Teléfono: +56 9 1234 5678</p>
                <p>Correo: contacto@galeriadearte.cl</p>
            </section>
        </main>

        <footer>
            <p>Galería de Arte - Todos los derechos reservados</p>
        </footer>
        
    </body>
</html>
